<!doctype html><html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巴士鬧鐘設定</title><style>body{font:17px system-ui;background:#fff3d9;color:#263f36;max-width:540px;margin:30px auto;padding:20px}h1{font-size:28px}label{display:block;margin:18px 0 6px}input,select,button{font:inherit;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #bcbaad;width:100%}button{background:#263f36;color:#fff3d9;margin-top:20px;cursor:pointer}small{display:block;margin:8px 0}#status{white-space:pre-wrap;padding:14px;background:#e8eddc;border-radius:10px}input[type=checkbox]{width:auto}button:disabled{opacity:.5}</style>
<h1>巴士鬧鐘設定</h1><p id="status" role="status">讀取連線狀態…</p>
<form id="form"><div id="pinArea"><label for="pin">板上設定頁的六位數設定碼</label><input id="pin" inputmode="numeric" maxlength="6" autocomplete="off"></div>
<label for="ssid">Wi-Fi 名稱（2.4GHz）</label><input id="ssid" maxlength="32" autocomplete="off"><label for="password">Wi-Fi 密碼</label><input id="password" type="password" maxlength="63" autocomplete="new-password"><small>留空代表保留現有 Wi-Fi；密碼只傳送到你的鬧鐘。</small>
<label for="route">巴士路線</label><input id="route" value="92" maxlength="6"><button type="button" id="lookup">搜尋路線</button>
<label for="direction">方向／班次</label><select id="direction"><option value="">先搜尋路線</option></select>
<label for="stop">上車站</label><select id="stop"><option value="">先選方向</option></select>
<label for="minutes">到站前幾分鐘提醒</label><input id="minutes" type="number" min="1" max="60" value="5">
<label for="brightness">屏幕亮度</label><input id="brightness" type="range" min="20" max="255" value="190">
<label><input id="armed" type="checkbox"> 開啟一次到站提醒</label><small>提醒觸發一次後自動關閉，避免同一班車重複響；可在板上重新開啟。未接喇叭時只有畫面提示。</small>
<button id="save" type="submit" disabled>儲存並連線</button></form>
<script>
(()=>{const $=id=>document.getElementById(id);const local=location.hostname==='127.0.0.1'||location.hostname==='localhost';$('pinArea').hidden=local;let catalog=[],allStops={},choices=[],selectedStops=[],version=0,ready=false;const base=local?'/kmb/':'https://data.etabus.gov.hk/v1/transport/kmb/';
async function get(path){const r=await fetch(base+path);if(!r.ok)throw Error('九巴資料暫時未能讀取');return (await r.json()).data;}
function option(select,value,label){const o=document.createElement('option');o.value=value;o.textContent=label;select.append(o);}
async function stations(){ready=false;$('save').disabled=true;const own=++version;const c=choices[Number($('direction').value)];if(!c)return;const d=c.bound==='O'?'outbound':'inbound';try{const rows=await get('route-stop/'+c.route+'/'+d+'/'+c.service_type);if(own!==version)return;selectedStops=rows.sort((a,b)=>Number(a.seq)-Number(b.seq));$('stop').replaceChildren();for(const s of selectedStops){option($('stop'),s.stop,`${s.seq}. ${allStops[s.stop]?.name_tc||s.stop}`);}if(c.route==='92'&&c.bound==='O'&&selectedStops.some(s=>s.stop==='5089C69E080B7A43'))$('stop').value='5089C69E080B7A43';ready=true;$('save').disabled=false;$('status').textContent='已載入九巴車站，請確認方向及上車站。';}catch(e){$('status').textContent=e.message;}}
$('lookup').onclick=async()=>{ready=false;$('save').disabled=true;$('status').textContent='讀取九巴路線…';try{if(!catalog.length){const results=await Promise.all([get('route/'),get('stop/')]);catalog=results[0];allStops=Object.fromEntries(results[1].map(s=>[s.stop,s]));}const r=$('route').value.trim().toUpperCase();choices=catalog.filter(c=>c.route===r);$('direction').replaceChildren();if(!choices.length)throw Error('搵唔到呢條九巴路線');choices.forEach((c,i)=>option($('direction'),i,`往 ${c.dest_tc} · 班次 ${c.service_type}`));$('direction').value=String(Math.max(0,choices.findIndex(c=>c.bound==='O'&&String(c.service_type)==='1')));await stations();}catch(e){$('status').textContent=e.message;}};
$('direction').onchange=stations;$('route').oninput=()=>{ready=false;$('save').disabled=true;};
$('form').onsubmit=async e=>{e.preventDefault();if(!ready)return;const c=choices[Number($('direction').value)];const i=selectedStops.findIndex(s=>s.stop===$('stop').value);if(i<0)return;const ss=selectedStops.slice(Math.max(0,i-2),i+1).map(s=>{const a=allStops[s.stop];return {id:s.stop,name:a.name_tc,lat:Number(a.lat),lng:Number(a.long),seq:Number(s.seq)};});const payload={route:c.route,bound:c.bound,service:Number(c.service_type),stop:$('stop').value,seq:Number(selectedStops[i].seq),destination:c.dest_tc,stops:ss,threshold:Number($('minutes').value),brightness:Number($('brightness').value),armed:$('armed').checked,ssid:$('ssid').value,password:$('password').value,key:local?window.SETUP_TOKEN:$('pin').value};$('save').disabled=true;try{const r=await fetch('/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw Error(j.error||'設定未儲存');$('password').value='';$('status').textContent='已送到板上。正在驗證設定及連線…';}catch(e){$('status').textContent=e.message;}finally{$('save').disabled=false;}};
async function status(){try{const r=await fetch('/state');const s=await r.json();if(!r.ok)return; if(s.message)$('status').textContent=s.message;if(s.ssid&&!$('ssid').value)$('ssid').placeholder=s.ssid;}catch(e){$('status').textContent='未能連到板，請保持 USB 連接。';}}
status();setInterval(status,7000);
})();
</script></html>
